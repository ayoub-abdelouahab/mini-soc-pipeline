title: Encoded PowerShell Download Cradle
id: test-soc-002
status: experimental
level: high
description: Detects powershell.exe with -Enc / -EncodedCommand and WebClient DownloadString
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\powershell.exe'
  selection_cli:
    CommandLine|contains:
      - ' -Enc '
      - ' -EncodedCommand'
      - 'FromBase64String'
      - 'DownloadString'
      - 'Hidden'
  condition: selection_img and selection_cli
falsepositives:
  - Admin scripts
tags:
  - attack.t1059.001
  - attack.execution
