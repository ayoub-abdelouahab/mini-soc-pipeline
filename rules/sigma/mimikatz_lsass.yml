title: Mimikatz and LSASS Access
id: test-soc-003
status: experimental
level: critical
description: Process mimikatz.exe or Sysmon EventID 10 access to lsass.exe with 0x1010/0x1410
logsource:
  product: windows
  category: process_creation
detection:
  selection_mimikatz:
    Image|contains: 'mimikatz'
    CommandLine|contains: 'sekurlsa'
  selection_lsass:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains: '0x10'
  condition: selection_mimikatz or selection_lsass
tags:
  - attack.t1003.001
  - attack.credential_access
